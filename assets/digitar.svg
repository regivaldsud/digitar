<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="DIGITAR">
  <title>DIGITAR</title>
  <defs>
    <linearGradient id="dg-fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b8cf0"/>
      <stop offset="1" stop-color="#1a55a8"/>
    </linearGradient>
    <linearGradient id="dg-tecla" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4edfa"/>
    </linearGradient>
  </defs>
  <!-- fundo -->
  <rect width="512" height="512" rx="116" fill="url(#dg-fundo)"/>
  <!-- tecla: lateral e face -->
  <rect x="92" y="132" width="328" height="300" rx="74" fill="#0e3d80"/>
  <rect x="92" y="92" width="328" height="300" rx="74" fill="url(#dg-tecla)"/>
  <!-- prompt de terminal ">_" : digitar + programar -->
  <polyline points="172,178 252,242 172,306" fill="none" stroke="#2a78d6" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="270" y="284" width="86" height="28" rx="14" fill="#eda100"/>
</svg>
